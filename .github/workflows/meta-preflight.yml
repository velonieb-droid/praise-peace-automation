name: Meta Connection Preflight (Read Only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta-preflight.yml'
      - 'scripts/validate_meta.py'
      - 'scripts/publish_approved.py'
      - 'posts/PP-2026-11-19.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate publisher syntax and approved caption fingerprint
        run: |
          python3 -m py_compile scripts/publish_approved.py scripts/validate_meta.py
          python3 -c "import json,hashlib; x=json.load(open('posts/PP-2026-11-19.json')); assert x['status']=='approved'; assert hashlib.sha256(x['caption'].encode('utf-8')).hexdigest()==x['caption_sha256']; print('PASS: syntax and approved caption checksum')"
      - name: Confirm expected Facebook and Instagram identity
        env:
          META_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.META_FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_ACCESS_TOKEN }}
        run: python3 scripts/validate_meta.py
