name: Meta Connection Preflight (Read Only)
run-name: Read-only Meta credential validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta-preflight.yml'
      - 'scripts/validate_meta.py'
      - 'scripts/publish_approved.py'
      - 'posts/PP-2026-11-19.json'
      - 'posts/PP-2026-11-20.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate publisher syntax and approved caption fingerprint
        run: |
          python3 -m py_compile scripts/publish_approved.py scripts/validate_meta.py
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from scripts.publish_approved import validate
          for post_id in ("PP-2026-11-19", "PP-2026-11-20"):
              data, url = validate(post_id)
              assert hashlib.sha256(data["caption"].encode("utf-8")).hexdigest() == data["caption_sha256"]
              print("PASS: approved manifest, caption checksum and image metadata for", post_id)
          PY
      - name: Confirm expected Facebook and Instagram identity
        env:
          META_SYSTEM_USER_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}
          POST_ID: PP-2026-11-20
        run: python3 scripts/validate_meta.py
