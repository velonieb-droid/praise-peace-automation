name: Test Approved Google Drive Image Delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-drive-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-public-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test anonymous JPEG access for approved assets
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import urllib.request

          images = {
              "PP-2026-11-19": {
                  "id": "1hJ7YzlQEL3mkbmVu3Pbqk9WRH6xVYY2M",
                  "sha256": "862fbb98d4a048b54d93f68d63dff84398107962c117c65c4a0e415d16bd4c63",
              },
              "PP-2026-11-20": {
                  "id": "1zJ4UG7N-zBhBGdolf_9Z59FH1VrNb2K_",
                  "sha256": "0154a304de17711d5bdf0dca142a027f44bf1bb2aee893ede1e1dcd977695e1d",
              }
          }

          for post_id, image in images.items():
              url = "https://drive.google.com/uc?export=download&id=" + image["id"]
              for agent in ("Mozilla/5.0", "facebookexternalhit/1.1"):
                  req = urllib.request.Request(url, headers={"User-Agent": agent})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      content = response.read(6_000_001)
                      mime = response.headers.get("Content-Type", "").lower()
                  valid = (mime.startswith("image/jpeg")
                           and content.startswith(bytes.fromhex("ffd8ff"))
                           and len(content) < 6_000_001
                           and hashlib.sha256(content).hexdigest() == image["sha256"])
                  print(post_id, "agent", agent, "mime", mime,
                        "size", len(content), "checksum_match", valid, flush=True)
                  if not valid:
                      raise SystemExit("BLOCKED: Invalid or inaccessible public image for " + post_id)
          print("PASS: exact approved JPEGs are anonymously downloadable for both user agents")
          PY
