name: Test Google Drive Public Image Delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-drive-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-public-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test approved public Google Drive image without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import urllib.error
          import urllib.parse
          import urllib.request
          file_id = "1hJ7YzlQEL3mkbmVu3Pbqk9WRH6xVYY2M"
          expected_sha = "862fbb98d4a048b54d93f68d63dff84398107962c117c65c4a0e415d16bd4c63"
          candidates = {
            "drive_uc_download": "https://drive.google.com/uc?export=download&id=" + file_id,
            "drive_uc_view": "https://drive.google.com/uc?export=view&id=" + file_id,
            "drive_thumbnail": "https://drive.google.com/thumbnail?id=" + file_id + "&sz=w1080",
            "drive_view": "https://drive.google.com/file/d/" + file_id + "/view",
          }
          for name, url in candidates.items():
            print("Testing", name, flush=True)
            for agent in ("Mozilla/5.0", "facebookexternalhit/1.1"):
              try:
                req = urllib.request.Request(url, headers={"User-Agent": agent})
                with urllib.request.urlopen(req, timeout=20) as resp:
                  b = resp.read(5000000)
                  mime = resp.headers.get("Content-Type", "")
                  print(name, agent, "status", resp.status, "mime", mime, "size", len(b),
                        "jpeg", b.startswith(bytes.fromhex("ffd8ff")),
                        "checksum_match", hashlib.sha256(b).hexdigest() == expected_sha, flush=True)
              except Exception as e:
                print(name, agent, "request failed", type(e).__name__, flush=True)
          PY
