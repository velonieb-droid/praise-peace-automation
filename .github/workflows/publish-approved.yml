name: Publish Approved Praise and Peace Post

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: Explicit approved post ID
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - release-triggers/PP-2026-11-22.txt

permissions:
  contents: write

concurrency:
  group: praise-peace-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release and ledger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate and publish approved image plus caption
        env:
          POST_ID: ${{ github.event_name == 'push' && 'PP-2026-11-22' || inputs.post_id }}
          META_SYSTEM_USER_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}
        run: python3 scripts/publish_approved.py
